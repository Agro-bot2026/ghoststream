<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e14;color:#e8edf5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100vh;user-select:none}

/* Player */
#player{position:fixed;inset:0;z-index:100;display:none;background:#000;flex-direction:column}
#player video{width:100%;flex:1;object-fit:contain;background:#000}
#player .bar{display:flex;align-items:center;padding:8px 16px;background:rgba(0,0,0,0.9);gap:12px}
#player .bar .name{flex:1;font-size:14px;font-weight:600;color:#fff}
#player .bar button{background:rgba(255,255,255,0.1);border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer}

/* Header */
.header{display:flex;align-items:center;padding:12px 16px 8px;gap:12px}
.header h1{font-size:24px;font-weight:900;background:linear-gradient(135deg,#e63946,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.header .badge{font-size:10px;background:rgba(230,57,70,0.15);color:#e63946;padding:2px 10px;border-radius:99px;letter-spacing:0.5px}
.header span{margin-left:auto;font-size:11px;color:#667;}

/* Search */
.search{padding:4px 16px 10px}
.search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:#151a22;color:#e8edf5;font-size:13px;outline:none;transition:all .2s}
.search input:focus{border-color:#e63946;background:#1a202a}

/* Categories */
.cats{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.cat{padding:6px 16px;border-radius:99px;border:1px solid rgba(255,255,255,0.06);font-size:12px;cursor:pointer;white-space:nowrap;background:transparent;color:#667;flex-shrink:0;transition:all .2s;font-weight:500}
.cat:hover{border-color:rgba(230,57,70,0.3);color:#e8edf5}
.cat.active{background:#e63946;color:#fff;border-color:#e63946;box-shadow:0 4px 15px rgba(230,57,70,0.3)}

/* Channels grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;padding:0 16px 100px;overflow-y:auto;height:calc(100vh - 190px)}
.channel{border-radius:12px;overflow:hidden;background:#151a22;border:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:all .25s;position:relative}
.channel:hover{transform:translateY(-2px);border-color:rgba(230,57,70,0.3);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
.channel .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#1a202a,#0d1117);display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
.channel .thumb img{width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}
.channel .thumb .play-overlay{position:absolute;inset:0;background:rgba(230,57,70,0);display:flex;align-items:center;justify-content:center;transition:all .25s;border-radius:12px}
.channel:hover .play-overlay{background:rgba(230,57,70,0.15)}
.channel .thumb .play-overlay svg{width:36px;height:36px;opacity:0;transition:all .25s;filter:drop-shadow(0 2px 8px rgba(230,57,70,0.5))}
.channel:hover .play-overlay svg{opacity:1}
.channel .info{padding:8px 10px 10px}
.channel .info .name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel .info .group{font-size:10px;color:#667;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Loading */
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0e14;z-index:999;flex-direction:column;gap:16px}
#loading .spinner{width:32px;height:32px;border:3px solid rgba(230,57,70,0.1);border-top-color:#e63946;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:#445}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Ghost TV</p></div>

<div id="player">
  <video id="videoPlayer" controls autoplay playsinline></video>
  <div class="bar"><div class="name" id="playerName"></div><button onclick="cerrarPlayer()">Cerrar ✕</button></div>
</div>

<div class="header">
  <h1>GHOST TV</h1>
  <div class="badge">LIVE</div>
  <span id="countSpan"></span>
</div>

<div class="search"><input id="searchInput" placeholder="🔍 Buscar canal..." oninput="filtrar(this.value)"></div>

<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>

var cats = [...new Set(canales.map(function(c){return c.g}))];
var catActiva = cats[0]||'';
document.getElementById('countSpan').textContent = canales.length + ' canales';

function render(filtroCat, busqueda){
  catActiva = filtroCat || catActiva;
  var f = canales.filter(function(c){return (!catActiva||c.g===catActiva) && (!busqueda||c.n.toLowerCase().includes(busqueda.toLowerCase()))});
  var div = document.getElementById('grid');
  div.innerHTML = f.map(function(c){
    var esc = function(s){return s.replace(/'/g,'\\u0027')};
    return '<div class="channel" onclick="reproducir(\''+esc(c.u)+'\',\''+esc(c.n)+'\')"><div class="thumb">'+(c.l?'<img src="'+c.l+'" alt="" onerror="this.outerHTML=\'📺\'">':'📺')+'<div class="play-overlay"><svg viewBox="0 0 24 24" fill="#e63946"><polygon points="5,3 19,12 5,21"/></svg></div></div><div class="info"><div class="name">'+c.n+'</div><div class="group">'+c.g+'</div></div></div>';
  }).join('');
  mostrarCats();
}

function mostrarCats(){
  var div = document.getElementById('cats');
  div.innerHTML = cats.map(function(c){
    return '<button class="cat '+(c===catActiva?'active':'')+'" onclick="cambiarCat(\''+c.replace(/'/g,'')+'\')">'+c+'</button>';
  }).join('');
}

function cambiarCat(c){catActiva=c;render(c,document.getElementById('searchInput').value);}
function filtrar(v){render(catActiva,v);}

function reproducir(url,name){
  document.getElementById('playerName').textContent = name;
  document.getElementById('player').style.display = 'flex';
  var video = document.getElementById('videoPlayer');
  if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;}
  else if(typeof Hls!=='undefined'&&Hls.isSupported()){
    var h=new Hls();h.loadSource(url);h.attachMedia(video);
    h.on(Hls.Events.ERROR,function(e,d){if(d.fatal){document.getElementById('playerName').textContent='Error: '+d.type;}});
  }
  video.play();
}
function cerrarPlayer(){var v=document.getElementById('videoPlayer');v.pause();v.src='';v.load();document.getElementById('player').style.display='none';}

mostrarCats();
render(catActiva,'');
document.getElementById('loading').style.display='none';
</script>
