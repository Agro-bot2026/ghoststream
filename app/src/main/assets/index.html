<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghost TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06090d;color:#f0f4f8;font-family:Arial,sans-serif;overflow:hidden}
#player{position:fixed;inset:0;z-index:100;display:none;background:#000}
#player video{width:100%;height:100%}
#player .close{position:absolute;top:10px;right:10px;z-index:101;background:rgba(255,0,0,0.8);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.nav{display:flex;align-items:center;padding:10px 15px;background:linear-gradient(180deg,#0d1117,transparent);position:sticky;top:0;z-index:10}
.nav h1{font-size:22px;color:#e63946;flex:1}
.nav span{font-size:11px;color:#8898aa}
.categorias{display:flex;gap:8px;padding:10px 15px;overflow-x:auto}
.categoria{padding:6px 16px;border-radius:99px;border:1px solid rgba(255,255,255,0.1);font-size:13px;cursor:pointer;white-space:nowrap;background:transparent;color:#8898aa}
.categoria.activa{background:#e63946;color:#fff;border-color:#e63946}
.canales{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px 15px;padding-bottom:80px;overflow-y:auto;height:calc(100vh - 110px)}
.canal{border-radius:10px;overflow:hidden;background:#111820;border:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:all .2s}
.canal:hover{transform:scale(1.03);border-color:#e63946}
.canal .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;font-size:40px}
.canal .info{padding:8px 10px}
.canal .info .titulo{font-size:13px;font-weight:600}
.canal .info .subtitulo{font-size:11px;color:#8898aa;margin-top:2px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06090d;z-index:999;flex-direction:column;gap:15px}
#loading .spinner{width:40px;height:40px;border:3px solid rgba(230,57,70,0.2);border-top-color:#e63946;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:#8898aa;font-size:14px}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Ghost TV - Cargando canales...</p>
</div>

<div id="player">
  <button class="close" onclick="cerrarPlayer()">✕</button>
  <video id="videoPlayer" controls autoplay></video>
</div>

<div class="nav">
  <h1>GHOST TV</h1>
  <span>@CharlyTricks</span>
</div>

<div class="categorias" id="categorias"></div>
<div class="canales" id="canales"></div>

<script>
// Canales
const canales = [
  {name:"Canal 1 HD",cat:"General",logo:"📺",url:"https://media-hls.growcdnssedge.com/b-hls-11/241917078/241917078_480p.m3u8"},
  {name:"Canal 2 HD",cat:"General",logo:"📺",url:"https://media-hls.growcdnssedge.com/b-hls-25/65863962/65863962_480p.m3u8"},
  {name:"Canal 3 HD",cat:"General",logo:"📺",url:"https://media-hls.growcdnssedge.com/b-hls-13/269545151/269545151_480p.m3u8"},
  {name:"Canal 4 HD",cat:"General",logo:"📺",url:"https://media-hls.growcdnssedge.com/b-hls-14/121606218/121606218_480p.m3u8"}
];

// Categorias desde Xtream (simuladas)
const categorias = ["General"];

let catActiva = "General";

function mostrarCanales(filtroCat) {
  catActiva = filtroCat || "General";
  const div = document.getElementById("canales");
  const filtrados = canales.filter(c => !filtroCat || c.cat === filtroCat);
  div.innerHTML = filtrados.map(c => `
    <div class="canal" onclick="reproducir('${c.url.replace(/'/g,"\\'")}','${c.name}')">
      <div class="thumb">${c.logo}</div>
      <div class="info">
        <div class="titulo">${c.name}</div>
        <div class="subtitulo">${c.cat}</div>
      </div>
    </div>
  `).join("");
}

function mostrarCategorias() {
  const cats = [...new Set(canales.map(c => c.cat))];
  const div = document.getElementById("categorias");
  div.innerHTML = cats.map(c => `
    <button class="categoria ${c === catActiva ? 'activa' : ''}" onclick="cambiarCategoria('${c}')">${c}</button>
  `).join("");
}

function cambiarCategoria(cat) {
  catActiva = cat;
  mostrarCategorias();
  mostrarCanales(cat);
}

function reproducir(url, name) {
  const player = document.getElementById("player");
  const video = document.getElementById("videoPlayer");
  player.style.display = "block";
  
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
  } else if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  }
  video.play();
}

function cerrarPlayer() {
  const video = document.getElementById("videoPlayer");
  video.pause();
  video.src = "";
  document.getElementById("player").style.display = "none";
}

// Iniciar
mostrarCategorias();
mostrarCanales("General");
document.getElementById("loading").style.display = "none";
</script>
</body>
</html>
