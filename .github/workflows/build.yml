name: Build StreamingFlashTV APK
on:
  push: { branches: [main, master] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3

      - name: Install SDK & Build tools
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK with Gradle
        run: |
          # Usar sdkmanager para instalar Gradle o usar directamente
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export JAVA_HOME=$JAVA_HOME_17_X64
          
          # Instalar Gradle via sdkman
          curl -sL "https://get.sdkman.io" | bash 2>/dev/null
          source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null
          sdk install gradle 8.5 2>/dev/null
          
          # Build
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: StreamingFlashTV-APK
          path: app/build/outputs/apk/debug/*.apk
